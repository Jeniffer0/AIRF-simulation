name: AIRF Simulation

on: [push, pull_request]

jobs:
  simulate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3'

      - name: Install readxl
        run: Rscript -e "install.packages('readxl', repos='https://cloud.r-project.org')"

      - name: Run AIRF simulation
        run: |
          Rscript AIRF_simulation_VERIFIED.R | tee simulation_results.txt

      - name: Upload simulation results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIRF-simulation-results
          path: simulation_results.txt
          retention-days: 90
